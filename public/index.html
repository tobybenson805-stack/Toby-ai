
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <link rel="manifest" href="/manifest.json">
  <title>Toby AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #10131c;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px;
      background: #191f2d;
      font-size: 22px;
      font-weight: bold;
    }

    header span { color: #63a7ff; }

    header a {
      float: right;
      color: white;
      font-size: 14px;
    }

    #chat {
      padding: 16px;
      height: calc(100dvh - 145px);
      overflow-y: auto;
    }

    .message {
      padding: 13px;
      margin: 12px 0;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #245b9d;
      margin-left: 35px;
    }

    .bot {
      background: #252d3d;
      margin-right: 35px;
    }

    .controls {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #191f2d;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 12px;
      border: 0;
      background: #30394b;
      color: white;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px;
      background: #3988ed;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; }

    #account {
      padding: 20px;
      text-align: center;
      background: #191f2d;
    }

    #clerk-auth {
      max-width: 420px;
      margin: 20px auto;
    }

    #accountStatus {
      color: #63a7ff;
      overflow-wrap: anywhere;
    }

    #authButtons,
    #signedInControls {
      margin-top: 15px;
    }

    #profileBtn {
      margin: 12px;
      padding: 12px 18px;
      background: #635bff;
    }

    #profilePanel {
      display: none;
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85%;
      max-width: 380px;
      padding: 22px;
      border-radius: 18px;
      background: #171b2b;
      color: white;
      z-index: 9999;
      text-align: center;
    }

    #profilePanel button {
      margin-top: 12px;
    }

    @media (max-width: 400px) {
      .controls { gap: 5px; }
      .controls button { padding: 10px; }
    }
  </style>
</head>

<body>

<header>
  🤖 Toby <span>AI</span>
  <a href="/plans.html">Plans</a>
</header>

<section id="account">

  <h2>Welcome to Toby AI 🤖</h2>

  <p id="accountStatus">
    Loading account service...
  </p>

  <div id="authButtons" style="display:none">
    <button onclick="showSignUp()">Create Account</button>
    <button onclick="showSignIn()">Log In</button>
  </div>

  <div id="clerk-auth"></div>

  <div id="signedInControls" style="display:none">
    <p>You're signed in to Toby AI!</p>
    <button onclick="logOut()">Log Out</button>
  </div>

</section>

<button id="profileBtn" onclick="openProfile()">
  👤 My Profile
</button>

<div id="profilePanel">
  <h2>My Profile</h2>
  <div id="clerkProfile"></div>
  <button onclick="closeProfile()">Close</button>
</div>

<main id="chat">
  <div class="message bot">
    Hey! I'm Toby AI. 😎
    What can I help you with today?
  </div>
</main>

<div class="controls" id="chatInput">
  <input
    id="message"
    placeholder="Ask Toby anything..."
  >

  <button id="sendBtn" onclick="sendMessage()">➤</button>

  <button onclick="listen()">🎤</button>
</div>

<script>

// =====================================
// TOBY AI CONFIGURATION
// =====================================

// Your Clerk PUBLIC publishable key.
// Never put your Clerk SECRET key here.

const CLERK_PUBLISHABLE_KEY =
  "pk_test_YWR2YW5jZWQtZmlsbHktOTcxOC5jbGVyay5hY2NvdW50cy5kZXYk";

// =====================================
// TOBY AI VARIABLES
// =====================================

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendBtn = document.getElementById("sendBtn");

const messages = [];

let clerkReady = false;
let clerkLoading = false;

// =====================================
// MESSAGE SYSTEM
// =====================================

function addMessage(text, type) {
  const div = document.createElement("div");

  div.className = "message " + type;
  div.textContent = text;

  chat.appendChild(div);

  chat.scrollTop = chat.scrollHeight;
}

// =====================================
// LOAD EXTERNAL SCRIPT SAFELY
// =====================================

function loadScript(src, publishableKey = null) {

  return new Promise((resolve, reject) => {

    const script = document.createElement("script");

    let finished = false;

    const timeout = setTimeout(() => {
      finish(new Error("Script loading timed out: " + src));
    }, 20000);

    function finish(error) {

      if (finished) return;

      finished = true;

      clearTimeout(timeout);

      if (error) {
        script.remove();
        reject(error);
      } else {
        resolve();
      }
    }

    script.src = src;
    script.async = true;
    script.crossOrigin = "anonymous";

    if (publishableKey) {
      script.setAttribute(
        "data-clerk-publishable-key",
        publishableKey
      );
    }

    script.onload = () => finish();
    script.onerror = () => {
      finish(new Error("Could not load Clerk script."));
    };

    document.head.appendChild(script);

  });

}

// =====================================
// CLERK ACCOUNT SERVICE
// =====================================

async function loadClerk() {

  if (clerkLoading || clerkReady) return;

  clerkLoading = true;

  const status = document.getElementById("accountStatus");

  try {

    status.textContent = "Checking Clerk configuration...";

    if (
      !CLERK_PUBLISHABLE_KEY ||
      !CLERK_PUBLISHABLE_KEY.startsWith("pk_test_") &&
      !CLERK_PUBLISHABLE_KEY.startsWith("pk_live_")
    ) {
      throw new Error("Invalid Clerk Publishable Key.");
    }

    // Get Clerk Frontend API domain.

    let clerkDomain;

    try {
      clerkDomain = atob(
        CLERK_PUBLISHABLE_KEY.split("_")[2]
      ).slice(0, -1);
    } catch {
      throw new Error("Could not decode Clerk domain.");
    }

    if (!clerkDomain || !clerkDomain.includes(".")) {
      throw new Error("Invalid Clerk domain.");
    }

    status.textContent = "Loading Clerk UI...";

    // Load official Clerk UI bundle.

    await loadScript(
      `https://${clerkDomain}/npm/@clerk/ui@1/dist/ui.browser.js`
    );

    status.textContent = "Loading Clerk SDK...";

    // Load official Clerk JavaScript SDK.

    await loadScript(
      `https://${clerkDomain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`,
      CLERK_PUBLISHABLE_KEY
    );

    if (!window.Clerk) {
      throw new Error("Clerk SDK did not initialize.");
    }

    status.textContent = "Connecting your account...";

    // Initialize Clerk.

    await window.Clerk.load({
      ui: {
        ClerkUI: window.__internal_ClerkUICtor
      }
    });

    clerkReady = true;
    clerkLoading = false;

    console.log("Toby AI: Clerk successfully loaded.");

    renderAccount();

    window.Clerk.addListener(() => {
      renderAccount();
    });

  } catch (error) {

    clerkLoading = false;

    clerkReady = false;

    console.error("Toby AI Clerk error:", error);

    status.textContent =
      "Account error: " + error.message;

    document.getElementById("authButtons").style.display = "none";

  }

}

// =====================================
// ACCOUNT DISPLAY
// =====================================

function renderAccount() {

  const status = document.getElementById("accountStatus");

  const buttons = document.getElementById("authButtons");

  const controls = document.getElementById("signedInControls");

  const auth = document.getElementById("clerk-auth");

  const clerk = window.Clerk;

  if (!clerkReady || !clerk) return;

  if (clerk.isSignedIn) {

    status.textContent = "Welcome to Toby AI!";

    buttons.style.display = "none";

    controls.style.display = "block";

    auth.innerHTML = "";

  } else {

    status.textContent = "Sign in or create your account.";

    buttons.style.display = "block";

    controls.style.display = "none";

  }

}

// =====================================
// SIGN UP
// =====================================

function showSignUp() {

  if (!clerkReady || !window.Clerk) return;

  const auth = document.getElementById("clerk-auth");

  auth.innerHTML = "";

  try {

    window.Clerk.mountSignUp(auth);

  } catch (error) {

    console.error(error);

    addMessage("Could not open sign-up. Please try again.", "bot");

  }

}

// =====================================
// SIGN IN
// =====================================

function showSignIn() {

  if (!clerkReady || !window.Clerk) return;

  const auth = document.getElementById("clerk-auth");

  auth.innerHTML = "";

  try {

    window.Clerk.mountSignIn(auth);

  } catch (error) {

    console.error(error);

    addMessage("Could not open login. Please try again.", "bot");

  }

}

// =====================================
// LOG OUT
// =====================================

async function logOut() {

  if (!clerkReady || !window.Clerk) return;

  try {

    await window.Clerk.signOut();

    document.getElementById("clerk-auth").innerHTML = "";

    closeProfile();

    renderAccount();

  } catch (error) {

    console.error(error);

    addMessage("Could not log out. Please try again.", "bot");

  }

}

// =====================================
// USER PROFILE
// =====================================

function openProfile() {

  const panel = document.getElementById("profilePanel");

  const profile = document.getElementById("clerkProfile");

  const clerk = window.Clerk;

  if (!clerkReady || !clerk || !clerk.user) {

    alert("Please log in first.");

    return;

  }

  panel.style.display = "block";

  profile.innerHTML = "";

  const user = clerk.user;

  const avatar = document.createElement("img");

  avatar.src = user.imageUrl || "";

  avatar.alt = "Profile picture";

  avatar.style.width = "85px";

  avatar.style.height = "85px";

  avatar.style.borderRadius = "50%";

  const name = document.createElement("h3");

  name.textContent = user.fullName || "Toby AI User";

  const username = document.createElement("p");

  username.textContent = "@" + (user.username || "no-username");

  const email = document.createElement("p");

  email.textContent = user.primaryEmailAddress
    ? user.primaryEmailAddress.emailAddress
    : "No email available";

  profile.append(
    avatar,
    name,
    username,
    email
  );

}

function closeProfile() {

  document.getElementById("profilePanel").style.display = "none";

}

// =====================================
// TEXT TO SPEECH
// =====================================

function speakReply(text) {

  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "en-US";

  speech.rate = 1;

  speech.pitch = 1;

  window.speechSynthesis.speak(speech);

}

// =====================================
// TOBY AI CHAT SYSTEM
// =====================================

async function sendMessage() {

  const text = input.value.trim();

  if (!text || sendBtn.disabled) return;

  if (!clerkReady || !window.Clerk || !window.Clerk.isSignedIn) {

    addMessage(
      "Please log in before chatting.",
      "bot"
    );

    return;

  }

  input.value = "";

  addMessage(text, "user");

  messages.push({
    role: "user",
    content: text
  });

  sendBtn.disabled = true;

  try {

    const token = await window.Clerk.session.getToken();

    if (!token) {
      throw new Error("Please log in again.");
    }

    const response = await fetch("/chat", {

      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },

      body: JSON.stringify({
        messages
      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed.");
    }

    const reply = data.reply || "I couldn't create a reply.";

    messages.push({
      role: "assistant",
      content: reply
    });

    addMessage(reply, "bot");

    speakReply(reply);

  } catch (error) {

    console.error("Toby AI error:", error);

    addMessage(
      "Toby AI error: " + error.message,
      "bot"
    );

  } finally {

    sendBtn.disabled = false;

  }

}

// =====================================
// ENTER KEY
// =====================================

input.addEventListener("keydown", event => {

  if (event.key === "Enter") {
    sendMessage();
  }

});

// =====================================
// VOICE INPUT
// =====================================

function listen() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {

    addMessage(
      "Voice input isn't supported here. Try your keyboard microphone.",
      "bot"
    );

    return;

  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-US";

  recognition.interimResults = false;

  recognition.onresult = event => {

    input.value = event.results[0][0].transcript;

    sendMessage();

  };

  recognition.onerror = () => {

    addMessage(
      "Microphone error. Please try again.",
      "bot"
    );

  };

  recognition.start();

}

// =====================================
// START TOBY AI
// =====================================

loadClerk();

</script>

</body>
</html>
