
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131c">
  <link rel="manifest" href="/manifest.json">
  <title>Toby AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #10131c;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 18px;
      background: #191f2d;
      font-size: 22px;
      font-weight: bold;
    }

    header span { color: #63a7ff; }

    #chat {
      padding: 16px;
      height: calc(100dvh - 145px);
      overflow-y: auto;
    }

    .message {
      padding: 13px;
      margin: 12px 0;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #245b9d;
      margin-left: 35px;
    }

    .bot {
      background: #252d3d;
      margin-right: 35px;
    }

    .controls {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #191f2d;
      position: fixed;
      bottom: 0;
      width: 100%;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 12px;
      border: 0;
      background: #30394b;
      color: white;
      font-size: 16px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px;
      background: #3988ed;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; }

    #account {
      padding: 20px;
      text-align: center;
      background: #191f2d;
    }

    #clerk-auth {
      max-width: 420px;
      margin: 20px auto;
    }

    #accountStatus {
      color: #63a7ff;
    }

    #chatInput {
      display: flex;
    }
  </style>
</head>

<body>

<header>
  🤖 Toby <span>AI</span>
  <a href="/plans.html"
     style="float:right;color:white;font-size:14px">
    Plans
  </a>
</header>

<section id="account">
  <h2>Welcome to Toby AI 🤖</h2>

  <p id="accountStatus">Loading account service...</p>

  <div id="authButtons" style="display:none">
    <button onclick="showSignUp()">Create Account</button>
    <button onclick="showSignIn()">Log In</button>
  </div>

  <div id="clerk-auth"></div>

  <div id="signedInControls" style="display:none">
    <p>You're signed in to Toby AI!</p>
    <button onclick="logOut()">Log Out</button>
  </div>
</section>

<main id="chat">
  <div class="message bot">
    Hey! I'm Toby AI. 😎
    What can I help you with today?
  </div>
</main>

<div class="controls" id="chatInput">
  <input id="message" placeholder="Ask Toby anything...">
  <button id="sendBtn" onclick="sendMessage()">➤</button>
  <button onclick="listen()">🎤</button>
</div>

<script>
  // IMPORTANT: Put your Clerk PUBLISHABLE key here.
  // Never put your Clerk SECRET key here.

  const CLERK_PUBLISHABLE_KEY =
    "pk_test_YWR2YW5jZWQtZmlsbHktOTcxOC5jbGVyay5hY2NvdW50cy5kZXYk";

  const chat = document.getElementById("chat");
  const input = document.getElementById("message");
  const sendBtn = document.getElementById("sendBtn");

  const messages = [];

  let clerkReady = false;

  function addMessage(text, type) {
    const div = document.createElement("div");
    div.className = "message " + type;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function loadClerk() {
    const status = document.getElementById("accountStatus");

    try {
      if (
        !CLERK_PUBLISHABLE_KEY ||
        CLERK_PUBLISHABLE_KEY.includes("PASTE_YOUR")
      ) {
        throw new Error("Add your Clerk publishable key first.");
      }

      const clerkDomain = atob(
        CLERK_PUBLISHABLE_KEY.split("_")[2]
      ).slice(0, -1);

      // Load Clerk's user interface.
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");

        script.src =
          `https://${clerkDomain}/npm/@clerk/ui@1/dist/ui.browser.js`;

        script.async = true;
        script.crossOrigin = "anonymous";
        script.onload = resolve;
        script.onerror = reject;

        document.head.appendChild(script);
      });

      // Load Clerk JavaScript.
      await new Promise((resolve, reject) => {
        const script = document.createElement("script");

        script.src =
          `https://${clerkDomain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`;

        script.async = true;
        script.crossOrigin = "anonymous";
        script.setAttribute(
          "data-clerk-publishable-key",
          CLERK_PUBLISHABLE_KEY
        );

        script.onload = resolve;
        script.onerror = reject;

        document.head.appendChild(script);
      });

      await Clerk.load({
        ui: {
          ClerkUI: window.__internal_ClerkUICtor
        }
      });

      clerkReady = true;

      renderAccount();

      Clerk.addListener(() => {
        renderAccount();
      });

    } catch (error) {
      console.error("Clerk error:", error);
      status.textContent =
        "Account setup problem: " + error.message;
    }
  }

  function renderAccount() {
    const status = document.getElementById("accountStatus");
    const buttons = document.getElementById("authButtons");
    const controls = document.getElementById("signedInControls");
    const auth = document.getElementById("clerk-auth");

    if (Clerk.isSignedIn) {
      status.textContent = "Welcome to Toby AI!";
      buttons.style.display = "none";
      controls.style.display = "block";
      auth.innerHTML = "";
    } else {
      status.textContent = "Sign in or create your account.";
      buttons.style.display = "block";
      controls.style.display = "none";
    }
  }

  function showSignUp() {
    if (!clerkReady) return;

    const auth = document.getElementById("clerk-auth");
    auth.innerHTML = "";

    Clerk.mountSignUp(auth);
  }

  function showSignIn() {
    if (!clerkReady) return;

    const auth = document.getElementById("clerk-auth");
    auth.innerHTML = "";

    Clerk.mountSignIn(auth);
  }

  async function logOut() {
    if (!clerkReady) return;

    await Clerk.signOut();
    document.getElementById("clerk-auth").innerHTML = "";
    renderAccount();
  }

  function speakReply(text) {
    if (!("speechSynthesis" in window)) return;

    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    speech.rate = 1;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
  }

  async function sendMessage() {
    const text = input.value.trim();

    if (!text || sendBtn.disabled) return;

    if (!clerkReady || !Clerk.isSignedIn) {
      addMessage("Please log in before chatting.", "bot");
      return;
    }

    input.value = "";

    addMessage(text, "user");

    messages.push({
      role: "user",
      content: text
    });

    sendBtn.disabled = true;

    try {
      const token = await Clerk.session.getToken();

      if (!token) {
        throw new Error("Please log in again.");
      }

      const response = await fetch("/chat", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${token}`
        },
        body: JSON.stringify({ messages })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Request failed.");
      }

      const reply = data.reply || "I couldn't create a reply.";

      messages.push({
        role: "assistant",
        content: reply
      });

      addMessage(reply, "bot");
      speakReply(reply);

    } catch (error) {
      console.error("Toby AI error:", error);
      addMessage("Toby AI error: " + error.message, "bot");

    } finally {
      sendBtn.disabled = false;
    }
  }

  input.addEventListener("keydown", event => {
    if (event.key === "Enter") {
      sendMessage();
    }
  });

  function listen() {
    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
      addMessage(
        "Voice input isn't supported here. Try your keyboard microphone.",
        "bot"
      );
      return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";
    recognition.interimResults = false;

    recognition.onresult = event => {
      input.value = event.results[0][0].transcript;
      sendMessage();
    };

    recognition.onerror = () => {
      addMessage("Microphone error. Please try again.", "bot");
    };

    recognition.start();
  }
</script>

<!-- TOBY AI PROFILE BUTTON -->
<button id="profileBtn" onclick="openProfile()">
  👤 My Profile
</button>

<!-- PROFILE PANEL -->
<div id="profilePanel" style="display:none;">
  <h2>My Profile</h2>
  <div id="clerkProfile"></div>
  <button onclick="closeProfile()">Close</button>
</div>

<style>
#profileBtn {
  padding: 12px 18px;
  border: none;
  border-radius: 12px;
  background: #635bff;
  color: white;
  cursor: pointer;
}

#profilePanel {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 85%;
  max-width: 380px;
  padding: 22px;
  border-radius: 18px;
  background: #171b2b;
  color: white;
  z-index: 9999;
  text-align: center;
}

#profilePanel button {
  padding: 10px 18px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}
</style>

<script>
function openProfile() {
  const panel = document.getElementById("profilePanel");
  const profile = document.getElementById("clerkProfile");

  if (!window.Clerk || !Clerk.user) {
    alert("Please log in first.");
    return;
  }

  panel.style.display = "block";
  profile.innerHTML = "";

  const user = Clerk.user;

  const avatar = document.createElement("img");
  avatar.src = user.imageUrl;
  avatar.style.width = "85px";
  avatar.style.height = "85px";
  avatar.style.borderRadius = "50%";

  const name = document.createElement("h3");
  name.textContent = user.fullName || "Toby AI User";

  const username = document.createElement("p");
  username.textContent = "@" + (user.username || "no-username");

  const email = document.createElement("p");
  email.textContent = user.primaryEmailAddress
    ? user.primaryEmailAddress.emailAddress
    : "No email available";

  profile.append(avatar, name, username, email);
}

function closeProfile() {
  document.getElementById("profilePanel").style.display = "none";
      recognition.start();
  }

  // Start Clerk when the page loads
  window.addEventListener("load", loadClerk);
}
</script>

</body>
</html>
