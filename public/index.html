<!DOCTYPE html>  <html lang="en">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1">  
  <meta name="theme-color" content="#10131c">  
  <link rel="manifest" href="/manifest.json">  
  <title>Toby AI</title>    <style>  
    * { box-sizing: border-box; }  
  
    body {  
      margin: 0;  
      background: #10131c;  
      color: white;  
      font-family: Arial, sans-serif;  
    }  
  
    header {  
      padding: 18px;  
      background: #191f2d;  
      font-size: 22px;  
      font-weight: bold;  
    }  
  
    header span { color: #63a7ff; }  
  
    #chat {  
      padding: 16px;  
      height: calc(100dvh - 145px);  
      overflow-y: auto;  
    }  
  
    .message {  
      padding: 13px;  
      margin: 12px 0;  
      border-radius: 14px;  
      line-height: 1.5;  
      white-space: pre-wrap;  
      overflow-wrap: anywhere;  
    }  
  
    .user {  
      background: #245b9d;  
      margin-left: 35px;  
    }  
  
    .bot {  
      background: #252d3d;  
      margin-right: 35px;  
    }  
  
    .controls {  
      display: flex;  
      gap: 8px;  
      padding: 12px;  
      background: #191f2d;  
      position: fixed;  
      bottom: 0;  
      width: 100%;  
    }  
  
    input {  
      flex: 1;  
      min-width: 0;  
      padding: 14px;  
      border-radius: 12px;  
      border: 0;  
      background: #30394b;  
      color: white;  
      font-size: 16px;  
    }  
  
    button {  
      border: 0;  
      border-radius: 12px;  
      padding: 12px;  
      background: #3988ed;  
      color: white;  
      font-size: 16px;  
      cursor: pointer;  
    }  
  
    button:disabled {  
      opacity: 0.5;  
    }  
  
    #account input {  
      width: 90%;  
      max-width: 350px;  
    }  
  </style>  </head>  <body>  <header>  
  🤖 Toby <span>AI</span>  
  <a href="/plans.html"  
     style="float:right;color:white;font-size:14px">  
    Plans  
  </a>  
</header>  <section id="account"  
  style="padding:20px;text-align:center;background:#191f2d;">    <h2>Welcome to Toby AI 🤖</h2>  <input id="email" type="email"  
placeholder="Enter your email">

<br><br>

<input id="password" type="password"  
placeholder="Create a password">

<br><br>

<button onclick="signUp()">Create Account</button>
<button onclick="logIn()">Log In</button>

  <p id="authMessage"></p>  
</section>  <main id="chat">  
  <div class="message bot">  
    Hey! I'm Toby AI. 😎  
    What can I help you with today?  
  </div>  
</main>  <div class="controls">  <input id="message"  
placeholder="Ask Toby anything...">

<button id="sendBtn" onclick="sendMessage()">➤</button>

<button onclick="listen()">🎤</button>

</div>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script src="/supabase-config.js"></script>  <script>  
  
const chat = document.getElementById("chat");  
const input = document.getElementById("message");  
const sendBtn = document.getElementById("sendBtn");  
  
const messages = [];  
  
// ACCOUNT CREATION  
  
async function signUp() {  
  const email = document.getElementById("email").value.trim();  
  const password = document.getElementById("password").value;  
  const message = document.getElementById("authMessage");  
  
  if (!window.tobySupabase) {  
    message.textContent = "Account service unavailable.";  
    return;  
  }  
  
  if (!email || !password) {  
    message.textContent = "Enter your email and password.";  
    return;  
  }  
  
  if (password.length < 8) {  
    message.textContent = "Password must be at least 8 characters.";  
    return;  
  }  
  
  try {  
    const { error } = await window.tobySupabase.auth.signUp({  
      email,  
      password  
    });  
  
    message.textContent = error  
      ? error.message  
      : "Account created! Check your email for confirmation.";  
  
  } catch (error) {  
    message.textContent = "Account creation failed.";  
  }  
}  
  
// LOGIN  
  
async function logIn() {  
  const email = document.getElementById("email").value.trim();  
  const password = document.getElementById("password").value;  
  const message = document.getElementById("authMessage");  
  
  if (!window.tobySupabase) {  
    message.textContent = "Account service unavailable.";  
    return;  
  }  
  
  if (!email || !password) {  
    message.textContent = "Enter your email and password.";  
    return;  
  }  
  
  try {  
    const { error } =  
      await window.tobySupabase.auth.signInWithPassword({  
        email,  
        password  
      });  
  
    message.textContent = error  
      ? error.message  
      : "Welcome back to Toby AI!";  
  
  } catch (error) {  
    message.textContent = "Login failed.";  
  }  
}  
  
// DISPLAY MESSAGES  
  
function addMessage(text, type) {  
  const div = document.createElement("div");  
  
  div.className = "message " + type;  
  div.textContent = text;  
  
  chat.appendChild(div);  
  chat.scrollTop = chat.scrollHeight;  
}  
  
// TOBY VOICE REPLY  
  
function speakReply(text) {  
  if (!("speechSynthesis" in window)) {  
    return;  
  }  
  
  window.speechSynthesis.cancel();  
  
  const speech = new SpeechSynthesisUtterance(text);  
  
  speech.lang = "en-US";  
  speech.rate = 1;  
  speech.pitch = 1;  
  
  window.speechSynthesis.speak(speech);  
}  
  
// SEND MESSAGE  
  
async function sendMessage() {  
  
  const text = input.value.trim();  
  
  if (!text || sendBtn.disabled) return;  
  
  input.value = "";  
  
  addMessage(text, "user");  
  
  messages.push({  
    role: "user",  
    content: text  
  });  
  
  sendBtn.disabled = true;  
  
  try {  
  
    const { data: sessionData, error: sessionError } =
  await window.tobySupabase.auth.getSession();

if (sessionError || !sessionData.session) {
  throw new Error("Please log in before chatting.");
}

const response = await fetch("/chat", {
  method: "POST",
  headers: {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${sessionData.session.access_token}`
  },
  body: JSON.stringify({ messages })
});
  
    const data = await response.json();  
  
    if (!response.ok) {  
      throw new Error(data.error || "Request failed");  
    }  
  
    const reply = data.reply || "I couldn't create a reply.";  
  
    messages.push({  
      role: "assistant",  
      content: reply  
    });  
  
    addMessage(reply, "bot");  
  
    // SPEAK TOBY'S RESPONSE  
    speakReply(reply);  
  
  } catch (error) {  
  
    console.error("Toby AI error:", error);  
  
    addMessage(  
      "Sorry! I couldn't connect. Please try again.",  
      "bot"  
    );  
  
  } finally {  
  
    sendBtn.disabled = false;  
  
  }  
}  
  
// ENTER KEY  
  
input.addEventListener("keydown", event => {  
  if (event.key === "Enter") {  
    sendMessage();  
  }  
});  
  
// MICROPHONE INPUT  
  
function listen() {  
  
  const SpeechRecognition =  
    window.SpeechRecognition ||  
    window.webkitSpeechRecognition;  
  
  if (!SpeechRecognition) {  
  
    addMessage(  
      "Voice input isn't supported here. Try your phone keyboard microphone.",  
      "bot"  
    );  
  
    return;  
  }  
  
  const recognition = new SpeechRecognition();  
  
  recognition.lang = "en-US";  
  recognition.interimResults = false;  
  
  recognition.onresult = event => {  
  
    input.value = event.results[0][0].transcript;  
  
    sendMessage();  
  
  };  
  
  recognition.onerror = () => {  
  
    addMessage(  
      "Microphone error. Please try again.",  
      "bot"  
    );  
  
  };  
  
  recognition.start();  
  
}  
  
</script>  </body>  
</html>
