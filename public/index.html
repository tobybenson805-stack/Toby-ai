
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#080b18">
<link rel="manifest" href="/manifest.json">
<title>Toby AI</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #080b18;
  --panel: #11162a;
  --purple: #925cff;
  --blue: #398dff;
  --text: #f7f7ff;
  --muted: #9ba4c0;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(ellipse at 15% 5%, #38206455, transparent 40%),
    radial-gradient(ellipse at 90% 45%, #123b7950, transparent 45%),
    var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

header {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: 18px;
  background: #10152bea;
  backdrop-filter: blur(18px);
  border-bottom: 1px solid #ffffff12;
  font-size: 23px;
  font-weight: 800;
}

header span {
  color: #a77aff;
  text-shadow: 0 0 15px #925cff;
}

header a {
  float: right;
  color: #c6b0ff;
  font-size: 14px;
  text-decoration: none;
  padding: 8px 13px;
  background: #925cff20;
  border: 1px solid #925cff50;
  border-radius: 20px;
}

#account {
  margin: 16px 14px;
  padding: 20px 15px;
  text-align: center;
  background: linear-gradient(145deg, #191c37, #10182c);
  border: 1px solid #8c69ff35;
  border-radius: 22px;
  box-shadow: 0 10px 35px #0005;
}

#account h2 {
  font-size: 21px;
  margin-top: 5px;
}

#account p {
  line-height: 1.5;
}

#accountStatus {
  color: #bba4ff;
  overflow-wrap: anywhere;
  font-size: 14px;
}

#authButtons,
#signedInControls {
  margin-top: 15px;
}

#clerk-auth {
  max-width: 420px;
  margin: 20px auto;
}

#profileBtn {
  display: block;
  margin: 12px 14px;
  padding: 12px 18px;
  background: #211b3c;
  border: 1px solid #925cff70;
  color: #d9c8ff;
}

#profilePanel {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 88%;
  max-width: 380px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 24px;
  border: 1px solid #925cff80;
  border-radius: 24px;
  background: #15182c;
  color: white;
  box-shadow: 0 0 45px #925cff35;
  z-index: 9999;
  text-align: center;
}

#profilePanel button {
  margin-top: 12px;
}

#chat {
  padding: 15px;
  height: calc(100dvh - 390px);
  min-height: 220px;
  overflow-y: auto;
  scroll-behavior: smooth;
  padding-bottom: 25px;
}

.message {
  max-width: 88%;
  padding: 14px 16px;
  margin: 13px 0;
  border-radius: 18px;
  line-height: 1.6;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 15px;
}

.user {
  margin-left: auto;
  background: linear-gradient(135deg, #713cff, #287fe9);
  border: 1px solid #a98aff55;
  border-bottom-right-radius: 5px;
  box-shadow: 0 5px 20px #6239d52b;
}

.bot {
  margin-right: auto;
  background: #171e34;
  border: 1px solid #8295d025;
  border-bottom-left-radius: 5px;
}

.controls {
  display: flex;
  gap: 9px;
  padding: 13px;
  padding-bottom: max(13px, env(safe-area-inset-bottom));
  background: #101529ed;
  border-top: 1px solid #ffffff15;
  backdrop-filter: blur(18px);
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  z-index: 30;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border-radius: 18px;
  border: 1px solid #7184c044;
  outline: none;
  background: #1a2138;
  color: white;
  font-size: 15px;
}

input:focus {
  border-color: #925cff;
  box-shadow: 0 0 15px #925cff30;
}

input::placeholder {
  color: #8993b2;
}

button {
  border: 0;
  border-radius: 15px;
  padding: 12px 16px;
  background: linear-gradient(135deg, #925cff, #397fff);
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  box-shadow: 0 4px 15px #653bce35;
}

button:active {
  transform: scale(.96);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

#chatInput button {
  min-width: 46px;
}

#authButtons button {
  margin: 4px;
}

@media (max-width: 400px) {
  header {
    padding: 17px 13px;
  }

  #chat {
    padding: 12px;
    height: calc(100dvh - 370px);
  }

  .controls {
    gap: 6px;
    padding: 10px;
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }

  .controls button {
    padding: 10px;
  }
}
/* PREMIUM SIDEBAR */

#menuBtn {
  background: #211b3c;
  border: 1px solid #925cff70;
  margin-right: 8px;
  padding: 9px 13px;
}

#sidebar {
  position: fixed;
  top: 0;
  left: -290px;
  width: 270px;
  height: 100dvh;
  padding: 25px 18px;
  background: linear-gradient(160deg, #17152e, #0c1428);
  border-right: 1px solid #925cff70;
  box-shadow: 10px 0 35px #0008;
  z-index: 1001;
  transition: left .3s ease;
}

#sidebar.open {
  left: 0;
}

#sidebar h2 {
  color: #c3a2ff;
  margin-bottom: 30px;
}

#sidebar button,
#sidebar a {
  display: block;
  width: 100%;
  margin: 12px 0;
  padding: 14px;
  text-align: left;
  text-decoration: none;
  color: white;
  background: #24213e;
  border: 1px solid #925cff40;
  border-radius: 13px;
  font-size: 15px;
}

#sidebar button:first-of-type {
  background: linear-gradient(135deg, #925cff, #397fff);
}

.sidebar-heading {
  margin-top: 30px;
  color: #929bb8;
  font-size: 11px;
  letter-spacing: 2px;
}

.sidebar-footer {
  position: absolute;
  bottom: 20px;
  color: #929bb8;
  font-size: 12px;
}

#sidebarOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: #0009;
  z-index: 1000;
}

#sidebarOverlay.show {
  display: block;
  }
/* TOBY AI ANIMATED WELCOME */

.welcome-screen {
  text-align: center;
  padding: 35px 15px;
  animation: welcomeFade 1s ease;
}

.welcome-orb {
  width: 90px;
  height: 90px;
  margin: 10px auto 22px;
  border-radius: 50%;
  background: linear-gradient(135deg, #925cff, #397fff);
  box-shadow: 0 0 25px #925cff, 0 0 55px #397fff80;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  animation: orbFloat 3s ease-in-out infinite;
}

.welcome-screen h2 {
  color: white;
  font-size: 25px;
  margin-bottom: 10px;
}

.welcome-screen p {
  color: #aeb8d5;
  font-size: 14px;
}

@keyframes orbFloat {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}

@keyframes welcomeFade {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<header>
  <button id="menuBtn" onclick="toggleSidebar()">☰</button>
  🤖 Toby <span>AI</span>
  <a href="/plans.html">Plans</a>
</header>
<div id="sidebarOverlay" onclick="toggleSidebar()"></div>

<aside id="sidebar">
  <h2>🤖 Toby AI</h2>

  <button onclick="newChat()">＋ New Chat</button>

  <div class="sidebar-heading">YOUR SPACE</div>

  <button onclick="openProfile()">👤 My Profile</button>

  <a href="/plans.html">💎 Plans</a>

  <p class="sidebar-footer">Powered by Toby AI</p>
</aside>
<section id="account">
  <h2>Welcome to Toby AI ✨</h2>
  <p id="accountStatus">Loading account service...</p>

  <div id="authButtons" style="display:none">
    <button onclick="showSignUp()">Create Account</button>
    <button onclick="showSignIn()">Log In</button>
  </div>

  <div id="clerk-auth"></div>

  <div id="signedInControls" style="display:none">
    <p>You're signed in to Toby AI!</p>
    <button onclick="logOut()">Log Out</button>
  </div>
</section>

<button id="profileBtn" onclick="openProfile()">
  👤 My Profile
</button>

<div id="profilePanel">
  <h2>My Profile</h2>
  <div id="clerkProfile"></div>
  <button onclick="closeProfile()">Close</button>
</div>

<main id="chat">
  <div class="welcome-screen">
    <div class="welcome-orb">🤖</div>
    <h2>Hey, I'm Toby AI!</h2>
    <p>Your smart AI assistant. Ready to help you explore, learn and create.</p>
  </div>
</main>

<div class="controls" id="chatInput">
  <input
    id="message"
    type="text"
    placeholder="Ask Toby anything..."
    autocomplete="off"
  >

  <button id="sendBtn" onclick="sendMessage()">➤</button>
  <button onclick="listen()">🎤</button>
</div>

<script>

// =====================================
// TOBY AI CONFIGURATION
// =====================================

// Keep your existing Clerk PUBLIC key here.
// Do not put your Clerk SECRET key here.

const CLERK_PUBLISHABLE_KEY =
  "pk_test_YWR2YW5jZWQtZmlsbHktOTcxOC5jbGVyay5hY2NvdW50cy5kZXYk";

// =====================================
// TOBY AI VARIABLES
// =====================================

const chat = document.getElementById("chat");
const input = document.getElementById("message");
const sendBtn = document.getElementById("sendBtn");

const messages = [];

let clerkReady = false;
let clerkLoading = false;

// =====================================
// MESSAGE SYSTEM
// =====================================

function addMessage(text, type) {
  const div = document.createElement("div");

  div.className = "message " + type;
  div.textContent = text;

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// =====================================
// LOAD EXTERNAL SCRIPT SAFELY
// =====================================

function loadScript(src, publishableKey = null) {
  return new Promise((resolve, reject) => {
    const script = document.createElement("script");

    let finished = false;

    const timeout = setTimeout(() => {
      finish(new Error("Script loading timed out: " + src));
    }, 20000);

    function finish(error) {
      if (finished) return;

      finished = true;
      clearTimeout(timeout);

      if (error) {
        script.remove();
        reject(error);
      } else {
        resolve();
      }
    }

    script.src = src;
    script.async = true;
    script.crossOrigin = "anonymous";

    if (publishableKey) {
      script.setAttribute(
        "data-clerk-publishable-key",
        publishableKey
      );
    }

    script.onload = () => finish();

    script.onerror = () => {
      finish(new Error("Could not load Clerk script."));
    };

    document.head.appendChild(script);
  });
}

// =====================================
// CLERK ACCOUNT SERVICE
// =====================================

async function loadClerk() {
  if (clerkLoading || clerkReady) return;

  clerkLoading = true;

  const status = document.getElementById("accountStatus");

  try {
    status.textContent = "Checking Clerk configuration...";

    if (
      !CLERK_PUBLISHABLE_KEY ||
      (
        !CLERK_PUBLISHABLE_KEY.startsWith("pk_test_") &&
        !CLERK_PUBLISHABLE_KEY.startsWith("pk_live_")
      )
    ) {
      throw new Error("Invalid Clerk Publishable Key.");
    }

    let clerkDomain;

    try {
      clerkDomain = atob(
        CLERK_PUBLISHABLE_KEY.split("_")[2]
      ).slice(0, -1);
    } catch {
      throw new Error("Could not decode Clerk domain.");
    }

    if (!clerkDomain || !clerkDomain.includes(".")) {
      throw new Error("Invalid Clerk domain.");
    }

    status.textContent = "Loading Clerk UI...";

    await loadScript(
      `https://${clerkDomain}/npm/@clerk/ui@1/dist/ui.browser.js`
    );

    status.textContent = "Loading Clerk SDK...";

    await loadScript(
      `https://${clerkDomain}/npm/@clerk/clerk-js@6/dist/clerk.browser.js`,
      CLERK_PUBLISHABLE_KEY
    );

    if (!window.Clerk) {
      throw new Error("Clerk SDK did not initialize.");
    }

    status.textContent = "Connecting your account...";

    await window.Clerk.load({
      ui: {
        ClerkUI: window.__internal_ClerkUICtor
      }
    });

    clerkReady = true;
    clerkLoading = false;

    console.log("Toby AI: Clerk successfully loaded.");

    renderAccount();

    window.Clerk.addListener(() => {
      renderAccount();
    });

  } catch (error) {
    clerkLoading = false;
    clerkReady = false;

    console.error("Toby AI Clerk error:", error);

    status.textContent = "Account error: " + error.message;

    document.getElementById("authButtons").style.display = "none";
  }
}

// =====================================
// ACCOUNT DISPLAY
// =====================================

function renderAccount() {
  const status = document.getElementById("accountStatus");
  const buttons = document.getElementById("authButtons");
  const controls = document.getElementById("signedInControls");
  const auth = document.getElementById("clerk-auth");

  const clerk = window.Clerk;

  if (!clerkReady || !clerk) return;

  if (clerk.isSignedIn) {
    status.textContent = "Welcome to Toby AI!";

    buttons.style.display = "none";
    controls.style.display = "block";
    auth.innerHTML = "";

  } else {
    status.textContent = "Sign in or create your account.";

    buttons.style.display = "block";
    controls.style.display = "none";
  }
}

// =====================================
// SIGN UP
// =====================================

function showSignUp() {
  if (!clerkReady || !window.Clerk) return;

  const auth = document.getElementById("clerk-auth");

  auth.innerHTML = "";

  try {
    window.Clerk.mountSignUp(auth);
  } catch (error) {
    console.error(error);
    addMessage("Could not open sign-up. Please try again.", "bot");
  }
}

// =====================================
// SIGN IN
// =====================================

function showSignIn() {
  if (!clerkReady || !window.Clerk) return;

  const auth = document.getElementById("clerk-auth");

  auth.innerHTML = "";

  try {
    window.Clerk.mountSignIn(auth);
  } catch (error) {
    console.error(error);
    addMessage("Could not open login. Please try again.", "bot");
  }
}

// =====================================
// LOG OUT
// =====================================

async function logOut() {
  if (!clerkReady || !window.Clerk) return;

  try {
    await window.Clerk.signOut();

    document.getElementById("clerk-auth").innerHTML = "";

    closeProfile();
    renderAccount();

  } catch (error) {
    console.error(error);
    addMessage("Could not log out. Please try again.", "bot");
  }
}

// =====================================
// USER PROFILE
// =====================================

function openProfile() {
  const panel = document.getElementById("profilePanel");
  const profile = document.getElementById("clerkProfile");
  const clerk = window.Clerk;

  if (!clerkReady || !clerk || !clerk.user) {
    alert("Please log in first.");
    return;
  }

  panel.style.display = "block";
  profile.innerHTML = "";

  const user = clerk.user;

  const avatar = document.createElement("img");

  avatar.src = user.imageUrl || "";
  avatar.alt = "Profile picture";
  avatar.style.width = "85px";
  avatar.style.height = "85px";
  avatar.style.borderRadius = "50%";
  avatar.style.objectFit = "cover";

  const name = document.createElement("h3");
  name.textContent = user.fullName || "Toby AI User";

  const username = document.createElement("p");
  username.textContent = "@" + (user.username || "no-username");

  const email = document.createElement("p");

  email.textContent = user.primaryEmailAddress
    ? user.primaryEmailAddress.emailAddress
    : "No email available";

  profile.append(avatar, name, username, email);
}

function closeProfile() {
  document.getElementById("profilePanel").style.display = "none";
}

// =====================================
// TEXT TO SPEECH
// =====================================

function speakReply(text) {
  if (!("speechSynthesis" in window)) return;

  window.speechSynthesis.cancel();

  const voices = window.speechSynthesis.getVoices();

  const maleVoice = voices.find(voice =>
    /male|david|mark|james|guy|daniel/i.test(voice.name)
  );

  const speech = new SpeechSynthesisUtterance(text);

  speech.lang = "en-US";
  speech.rate = 0.95;
  speech.pitch = 0.85;

  if (maleVoice) {
    speech.voice = maleVoice;
  }

  window.speechSynthesis.speak(speech);
}

// =====================================
// TOBY AI CHAT SYSTEM
// =====================================

async function sendMessage() {
  const text = input.value.trim();

  if (!text || sendBtn.disabled) return;

  if (!clerkReady || !window.Clerk || !window.Clerk.isSignedIn) {
    addMessage("Please log in before chatting.", "bot");
    return;
  }

  input.value = "";

  addMessage(text, "user");

  messages.push({
    role: "user",
    content: text
  });

  sendBtn.disabled = true;

  try {
    const token = await window.Clerk.session.getToken();

    if (!token) {
      throw new Error("Please log in again.");
    }

    const response = await fetch("/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({ messages })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed.");
    }

    const reply = data.reply || "I couldn't create a reply.";

    messages.push({
      role: "assistant",
      content: reply
    });

    addMessage(reply, "bot");

    speakReply(reply);

  } catch (error) {
    console.error("Toby AI error:", error);

    addMessage(
      "Toby AI error: " + error.message,
      "bot"
    );

  } finally {
    sendBtn.disabled = false;
  }
}

// =====================================
// ENTER KEY
// =====================================

input.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    sendMessage();
  }
});

// =====================================
// VOICE INPUT
// =====================================

function listen() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    addMessage(
      "Voice input isn't supported here. Try your keyboard microphone.",
      "bot"
    );
    return;
  }

  const recognition = new SpeechRecognition();

  recognition.lang = "en-US";
  recognition.interimResults = false;

  recognition.onresult = event => {
    input.value = event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = () => {
    addMessage(
      "Microphone error. Please try again.",
      "bot"
    );
  };

  recognition.start();
}

// =====================================
// START TOBY AI
// =====================================

loadClerk();
// =====================================
// TOBY AI SIDEBAR
// =====================================

function toggleSidebar() {
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebarOverlay");

  sidebar.classList.toggle("open");
  overlay.classList.toggle("show");
}

// =====================================
// START A NEW CHAT
// =====================================

function newChat() {
  messages.length = 0;

  chat.innerHTML = `
    <div class="welcome-screen">
      <div class="welcome-orb">🤖</div>
      <h2>Hey, I'm Toby AI!</h2>
      <p>Your smart AI assistant. Ready to help you explore, learn and create.</p>
    </div>
  `;

  toggleSidebar();
}
</script>

</body>
</html>
