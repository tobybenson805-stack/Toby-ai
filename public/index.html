  <title>Toby AI</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #10131c;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 16px;
      background: #191f2d;
      font-size: 22px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    header span { color: #63a7ff; }

    .header-buttons {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 11px;
      background: #3988ed;
      color: white;
      font-size: 14px;
      cursor: pointer;
    }

    button:disabled { opacity: 0.5; }

    #account {
      padding: 18px;
      text-align: center;
      background: #191f2d;
    }

    #account input {
      width: 90%;
      max-width: 350px;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #30394b;
      color: white;
      font-size: 16px;
    }

    #chat {
      padding: 16px;
      height: calc(100dvh - 240px);
      min-height: 250px;
      overflow-y: auto;
    }

    .message {
      padding: 13px;
      margin: 12px 0;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #245b9d;
      margin-left: 35px;
    }

    .bot {
      background: #252d3d;
      margin-right: 35px;
    }

      gap: 8px;
